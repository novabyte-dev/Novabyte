<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaBot AI | Asistente NovaByte</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; padding: 15px; }
        
        .header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 15px; border-bottom: 1px solid #334155; margin-bottom: 15px; }
        .back-btn { color: var(--primary); text-decoration: none; font-weight: bold; font-size: 0.9rem; }
        
        #chat-container { flex: 1; background: var(--card); border-radius: 12px; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; border: 1px solid #334155; }
        
        .message { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 0.95rem; line-height: 1.4; }
        .bot { background: #0284c7; color: white; align-self: flex-start; border-bottom-left-radius: 2px; }
        .user { background: #334155; color: var(--text); align-self: flex-end; border-bottom-right-radius: 2px; }
        
        .input-area { display: flex; gap: 10px; margin-top: 15px; }
        input { flex: 1; background: var(--card); border: 1px solid #334155; color: var(--text); padding: 12px; border-radius: 8px; outline: none; }
        button { background: var(--primary); color: var(--bg); border: none; padding: 0 18px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <a href="Index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> ← Volver a Inicio</a>
        <h3 style="color: var(--primary);"><i class="fa-solid fa-robot"></i> NovaBot AI</h3>
    </div>

    <div id="chat-container">
        <div class="message bot">
            ¡Hola! 👋 Soy <b>NovaBot</b>, el asistente inteligente de NovaByte. ¿En qué puedo ayudarte hoy? Pregúntame sobre páginas web, apps, precios o seguridad.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Escribe tu consulta aquí..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');

        function sendMessage() {
            const input = document.getElementById('userInput');
            const text = input.value.trim();
            if (!text) return;

            // Mensaje del usuario
            addMessage(text, 'user');
            input.value = '';

            // Respuesta automatizada de la IA
            setTimeout(() => {
                const response = getBotResponse(text.toLowerCase());
                addMessage(response, 'bot');
            }, 600);
        }

        function addMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', sender);
            msgDiv.innerHTML = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function getBotResponse(input) {
            if (input.includes('hola') || input.includes('buenas')) {
                return "¡Hola! ¿Cómo estás? ¿Te gustaría cotizar un servicio para tu empresa?";
            } else if (input.includes('precio') || input.includes('costo') || input.includes('presupuesto')) {
                return "Nuestros planes principales son:<br>• <b>Web Pro:</b> desde $500<br>• <b>App Custom:</b> desde $1200<br>• <b>Bots IA:</b> desde $300";
            } else if (input.includes('web') || input.includes('pagina')) {
                return "Creamos sitios web corporativos a medida, totalmente adaptados a teléfonos móviles y optimizados con SEO.";
            } else if (input.includes('app') || input.includes('movil') || input.includes('celular')) {
                return "Desarrollamos aplicaciones móviles nativas para iOS y Android según los requerimientos de tu negocio.";
            } else if (input.includes('seguridad') || input.includes('audit')) {
                return "Realizamos auditorías de ciberseguridad (NovaShield) para proteger tus bases de datos y servidores de vulnerabilidades.";
            } else {
                return "Entendido. Para darte detalles personalizados sobre esa solicitud, puedes presionar el botón de WhatsApp en la página principal para hablar con un asesor humano.";
            }
        }
    </script>
</body>
</html>
